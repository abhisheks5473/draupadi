name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build the debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename it
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/draupadi.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: draupadi-apk
          path: out/draupadi.apk
          if-no-files-found: error

      - name: Publish it to the "latest" release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Draupadi — latest build
          body: |
            Sideload `draupadi.apk` on any Android 8 or newer phone.
            Built automatically from commit ${{ github.sha }}.
          files: out/draupadi.apk
          make_latest: true
